task:
  title: "OpenClaw Architecture Transfer to Kukuvaia"
  description: "Research which architectural elements from OpenClaw are transferable to kukuvaia and how to adapt them to Java/Spring AI stack"
  status: in_progress
  tags: [research, architecture, migration]
  priority: high

research_context:
  research_type: "mixed"
  research_question: "Which architectural elements from OpenClaw are transferable to kukuvaia and how to adapt them to Java/Spring AI stack?"
  scope:
    included:
      - "OpenClaw plugin architecture and SDK boundaries"
      - "OpenClaw security model and trust boundaries"
      - "OpenClaw channel abstraction and messaging"
      - "OpenClaw skills and extensibility system"
      - "OpenClaw ACP/IDE integration"
      - "OpenClaw multi-agent safety patterns"
      - "OpenClaw doctor/diagnostic command"
      - "OpenClaw build/test gate terminology"
      - "Kukuvaia current architecture (Spring AI, MCP, personas)"
      - "Kukuvaia extension points and planned extensibility"
    excluded:
      - "OpenClaw TypeScript-specific patterns (ESM, Bun, etc.)"
      - "OpenClaw platform-specific code (macOS app, iOS, Android)"
      - "OpenClaw CI/CD and release automation details"
      - "Direct code porting (this is concept transfer, not code migration)"
    constraints:
      - "Target stack is Java 21 / Spring Boot 3.x / Spring AI 1.x / Kotlin (Embabel)"
      - "CLI is Go/Charm stack (separate repo)"
      - "Must maintain kukuvaia's existing architecture decisions"
      - "Open source direction (Apache 2.0)"
  methodology: ["multi-source-comparative-architecture-analysis"]
  sources: ["openclaw-codebase", "kukuvaia-docs", "kukuvaia-source", "openclaw-docs"]
  confidence_level: "high"
  gathering_strategy:
    categories: ["openclaw-plugin-architecture", "openclaw-security-trust", "openclaw-channels-skills", "openclaw-devx-patterns", "kukuvaia-architecture"]
    count: 5
    source: "planner"
  phase_summaries:
    phase-2:
      summary: "Brainstorming and design both enabled based on synthesis showing multiple viable approaches for extension unification, security hardening, and tool safety."
    phase-3:
      summary: "3 decision areas explored with 11 alternatives total. Recommended: 1D (skills-first), 2A+2B (incremental+namespace), 3D (hybrid groups+annotations)."
    phase-4:
      summary: "User converged on all 3 recommended approaches."
      decision_areas:
        - area: "Extension/Plugin Unification"
          alternatives_count: 4
          chosen_approach: "1D: Skills-First Pattern Extraction"
        - area: "Security Hardening"
          alternatives_count: 3
          chosen_approach: "2A+2B: Incremental Advisors + Config Namespace"
        - area: "Tool Safety and Approval"
          alternatives_count: 4
          chosen_approach: "3D: Hybrid Static Groups + Annotations (phased)"
      deferred_ideas:
        - "Exclusive slot system for memory"
        - "Advisor chain terminal semantics"
        - "Session key grammar"
        - "Channel abstraction"
        - "ClawHub marketplace"
        - "ACP/IDE bridge"
        - "Formal verification (TLA+)"
        - "Exec sandbox backends (Docker/SSH)"
    phase-1:
      summary: "Research foundation complete. 5 parallel gatherers analyzed OpenClaw plugin architecture (12 patterns), security/trust model (13 findings incl. 5 high-priority transfers), channels/skills (15 patterns), DevX (7 patterns), and kukuvaia architecture (10 gaps, 9 existing extension points). Synthesis identified 10 transferable elements in 3 tiers: Tier 1 (P0, small effort) = tool policy groups, content wrapping, dangerous config naming, prompt cache stability; Tier 2 (P1, medium effort) = skills enrichment, doctor command, tool safety classification, trust model doc, advisor enrichment, session key grammar; Tier 3 (deferred) = plugin SDK, exclusive slots, sandbox, marketplace. 6 elements deemed not transferable (channel abstraction, marketplace, ACP bridge, DM pairing, formal verification, multi-channel routing)."
      steps_completed: ["init", "plan", "gather", "synthesize"]
