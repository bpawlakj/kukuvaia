plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.21' apply false
}

subprojects {
    group = 'ai.kukuvaia'
    version = '0.1.0-SNAPSHOT'

    apply plugin: 'io.spring.dependency-management'

    // Required for Spring to resolve @PathVariable/@RequestParam names via reflection
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }

    repositories {
        mavenCentral()
    }

    // Gradle 9 no longer puts the JUnit Platform launcher on the test runtime classpath implicitly.
    plugins.withType(JavaPlugin).configureEach {
        dependencies {
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }

    ext {
        set('springAiVersion', '2.0.2')
        // Must match the Kotlin Gradle plugin version above. Spring Boot's BOM otherwise pins
        // kotlin-* (including kotlin-compiler-embeddable) to its own managed version, which
        // breaks the compiler when the plugin is newer.
        set('kotlinVersion', '2.4.21')
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
            mavenBom('org.springframework.boot:spring-boot-dependencies:4.1.2') {
                bomProperty 'kotlin.version', kotlinVersion
            }
        }
    }
}
