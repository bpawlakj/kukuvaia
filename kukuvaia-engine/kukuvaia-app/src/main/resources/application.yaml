kukuvaia:
  max-tool-rounds: 20
  llm:
    request-timeout: 120
  daemon:
    daily-token-budget: 100000
  subagent:
    max-parallel-workers: 3
  webhooks:
    rate-limit-per-minute: 10
    secret: ${WEBHOOK_SECRET:}
  providers:
    copilot:
      # GitHub Copilot OAuth device flow. Defaults match the public client ID used
      # by the official VS Code / JetBrains / GitHub CLI plugins, so no per-user
      # registration is needed. Override only for testing against a stub.
      client-id: ${KUKUVAIA_COPILOT_CLIENT_ID:Iv1.b507a08c87ecfe98}
      scope: ${KUKUVAIA_COPILOT_SCOPE:read:user}
      # The long-lived GitHub OAuth token is persisted here with chmod 600.
      # Short-lived (~25 min) Copilot bearer tokens stay in-memory.
      credentials-path: ${KUKUVAIA_COPILOT_CREDENTIALS_PATH:}
  security:
    strict-permissions: true
    dev-mode: ${KUKUVAIA_SECURITY_DEV_MODE:true}
  memory:
    consolidation:
      cron: ${MEMORY_CONSOLIDATION_CRON:0 0 3 * * *}
      decay-factor: 0.95
      unaccessed-days: 7
      similarity-threshold: 0.95
  chat:
    memory:
      # Sliding window of last N messages included in every LLM request.
      # Modern models support >200K context; 100 msgs ≈ 30K tokens is a safe default.
      max-messages: ${KUKUVAIA_CHAT_MEMORY_MAX_MESSAGES:100}
  routing:
    # Master switch for model routing (ModelRoutingAdvisor).
    enabled: ${KUKUVAIA_ROUTING_ENABLED:true}
    # P19 shadow mode — computes complexity-driven routing in parallel with the
    # authoritative keyword classifier and records divergence via the
    # `kukuvaia.routing.shadow_diff` counter. Never mutates the request.
    shadow-mode: ${KUKUVAIA_ROUTING_SHADOW_MODE:true}
  supervisor:
    # P14 small-supervisor mode. FULL ships the verbose system prompt with
    # proactivity rules (safe for 70B+ / frontier models). CONCISE ships a
    # bounded, imperative prompt (<60 words, English only) for 7B-27B local
    # models — proactivity behaviour moves from prompt to deterministic
    # advisors (SessionContextAdvisor injects structured prompts only when
    # relevant state exists).
    verbosity: ${KUKUVAIA_SUPERVISOR_VERBOSITY:FULL}

spring:
  application:
    name: kukuvaia-engine
  ai:
    # Spring AI's default RetryTemplate is brutal: 10 attempts with exponential backoff to ~3min.
    # When SmartGate's 10-second LiteLLM proxy timeout fires (TransientAiException 408), the
    # default chews up 3+ minutes wiggling on the same dead request. We cap to 2 attempts with
    # ≤5s backoff so a flaky upstream bubbles up to the operator within ~15s, not 3 minutes.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    openai:
      base-url: ${LLM_BASE_URL:https://api.openai.com}
      api-key: ${LLM_API_KEY:not-used}
      connect-timeout: ${LLM_CONNECT_TIMEOUT:10s}
      read-timeout: ${LLM_READ_TIMEOUT:120s}
      chat:
        options:
          model: ${LLM_MODEL:claude-sonnet-4.5}
          temperature: 0.2
      embedding:
        enabled: ${OPENAI_EMBEDDING_ENABLED:false}
    embedding:
      transformer:
        onnx:
          model-uri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
          gpu-device-id: -1
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    # P22 — remote MCP consumption. Connections + auth headers are read from the
    # `kukuvaia.mcp_connections` table (managed through the admin dashboard) via
    # the DbMcpSseClientConnectionDetails bean. There is intentionally no
    # `sse.connections.*` block here — connection list lives in the DB so ops
    # can add/rotate remote MCP servers without a redeploy.
    mcp:
      client:
        enabled: ${KUKUVAIA_MCP_CLIENT_ENABLED:false}
        name: kukuvaia-engine
        version: 0.1.0
        # 60s — covers slow cold-cache tool calls against remote MCP servers (large list
        # responses, cross-DB joins). The 30s Spring default trips on warm-up scenarios;
        # a 2× headroom is cheap and avoids spurious tool-loop aborts.
        request-timeout: 60s
        type: SYNC
        toolcallback:
          enabled: true
  datasource:
    url: ${PG_DSN:jdbc:postgresql://localhost:5432/kukuvaia}?currentSchema=kukuvaia,public
    username: ${PG_USER:kukuvaia}
    password: ${PG_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: kukuvaia
    default-schema: kukuvaia
    baseline-on-migrate: true
    baseline-version: '0'

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: ${KUKUVAIA_METRICS_ENABLED:true}
  metrics:
    tags:
      application: kukuvaia-engine
    distribution:
      percentiles-histogram:
        kukuvaia.llm.request.duration: true
        kukuvaia.tool.call.duration: true
        kukuvaia.memory.extraction.duration: true
        kukuvaia.memory.injection.duration: true
      slo:
        kukuvaia.llm.request.duration: 1s,5s,15s,30s,60s
        kukuvaia.tool.call.duration: 100ms,500ms,1s,5s
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      jdbc: true

logging:
  level:
    ai.kukuvaia: INFO
    org.springframework.ai.chat.client.advisor.ToolCallAdvisor: DEBUG
    org.springframework.ai.openai: DEBUG
